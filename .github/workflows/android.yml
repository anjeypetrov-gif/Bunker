name: Android build (RuStore)

# Запуск вручную: GitHub → Actions → «Android build (RuStore)» → Run workflow.
# Без секретов собирается тестовый debug-APK. Если заданы секреты подписи
# (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) — ещё и подписанный release-APK/AAB для магазина.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (целое число, каждый новый выпуск больше предыдущего)"
        default: "1"
      version_name:
        description: "versionName (для людей, например 1.0.0)"
        default: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: android-actions/setup-android@v3

      - name: Установка Capacitor и синхронизация
        working-directory: android-app
        run: |
          npm install
          npx cap sync android

      - name: Debug APK (для проверки на телефоне)
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Подготовка ключа подписи
        id: keys
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "have_keys=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_keys=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release APK и AAB (подписанные)
        if: steps.keys.outputs.have_keys == 'true'
        working-directory: android-app/android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Сохранить debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bunker-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/*.apk

      - name: Сохранить release APK/AAB
        if: steps.keys.outputs.have_keys == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bunker-release
          path: |
            android-app/android/app/build/outputs/apk/release/*.apk
            android-app/android/app/build/outputs/bundle/release/*.aab
